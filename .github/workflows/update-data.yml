name: 아파트 실거래 데이터 자동 갱신

# 매일 KST 06:00(UTC 21:00)에 국토부 실거래가를 다시 수집해 data/apartment_data.json 을 갱신.
# 수동 실행도 가능(Actions 탭 -> Run workflow).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 갱신된 데이터를 저장소에 커밋/푸시하기 위해 필요

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 의존성 설치
        run: pip install -r requirements-data.txt

      - name: 실거래 데이터 수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}   # 저장소 Secrets 에 등록 필요
        run: python fetch_data.py --months 24

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/apartment_data.json
          if git diff --staged --quiet; then
            echo "데이터 변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 실거래 데이터 자동 갱신"
            git push
          fi
